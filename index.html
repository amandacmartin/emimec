<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão e Empreendedorismo | Técnico em Mecânica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #f97316;
            --accent-hover: #ea580c;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: rgba(249, 115, 22, 0.15);
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #26334d;
            color: var(--text-primary);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        .btn .icon {
            font-size: 1.2rem;
            transition: transform 0.25s ease;
        }

        .btn:hover .icon {
            transform: translateX(4px);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Técnico em Mecânica</span>
        <h1>Gestão e Empreendedorismo</h1>
        <p>Selecione uma atividade para iniciar:</p>

        <nav class="menu">
                   
            <a href="./capacidade.html" class="btn">
                <span>Capacidade produtiva</span>
                <span class="icon">➔</span>
            <a href="./demanda.html" class="btn">
                <span>Exercícios sobre demanda</span>
                <span class="icon">➔</span>
                <a href="./swot.html" class="btn">
                <span>Analise ambiental</span>
                <span class="icon">➔</span>
           
            </a>
        </nav>

        <footer>
            Plataforma de Atividades Práticas
        </footer>
    </div>

</body>
</html>
